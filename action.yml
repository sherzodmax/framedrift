name: 'framedrift — Figma vs preview visual diff'
description: 'Compare your Vercel preview deployment with the Figma frames it was built from and comment the visual drift on the PR.'
author: 'framedrift'
branding:
  icon: 'layers'
  color: 'purple'
inputs:
  figma-token:
    description: 'Figma personal access token (read-only, file_content:read). Store as a repository secret.'
    required: true
  github-token:
    description: 'Token used to read the PR and post the comment.'
    default: ${{ github.token }}
  preview-url:
    description: 'Preview base URL. Defaults to the URL from the deployment_status event (Vercel GitHub integration).'
    required: false
  config:
    description: 'Path to the frames config file (default .framedrift.json, which may be absent if frames come from the PR description). A path set here that does not exist fails the check.'
    default: ''
  fail-on:
    description: 'Mismatch % above which a frame counts as drifted (default: defaults.failOn in the config, else 2). A frame''s own failOn wins. Failing the check on drift requires a Pro license.'
    default: ''
  threshold:
    description: 'Per-pixel color tolerance 0..1 (default: defaults.threshold in the config, else 0.1).'
    default: ''
  figma-files:
    description: 'Comma-separated Figma file keys this repo may render. Frames linking other files are reported as errors and never fetched. Recommended: without it, a PR description can link any file the figma-token can read.'
    required: false
  license-key:
    description: 'framedrift Pro license key (Polar). Optional.'
    required: false
  vercel-bypass-secret:
    description: 'Vercel "Protection Bypass for Automation" secret, if Deployment Protection is on.'
    required: false
  vercel-project:
    description: 'Vercel project name. With a bypass secret set, it is only sent to this project''s preview URLs (<project>-*.vercel.app, or <project>-*-<team>.vercel.app with vercel-team). Without it (and without preview-hosts) any *.vercel.app host gets it, with a warning.'
    required: false
  vercel-team:
    description: 'Vercel team / account slug as it appears at the end of your preview URLs (my-app-git-x-<team>.vercel.app). Narrows vercel-project further.'
    required: false
  preview-hosts:
    description: 'Comma-separated hosts the bypass secret may be sent to; replaces the vercel-project / *.vercel.app default (e.g. "preview.acme.dev, *.staging.acme.dev, my-app-*-acme.vercel.app"; "*" inside a label matches one label). With a bypass secret set, the preview must also be https on port 443; anything else fails the check and gets nothing.'
    required: false
  allow-loopback-preview:
    description: 'Allow a localhost / 127.0.0.1 preview-url (true/false). Only for CI smoke tests on the runner itself. Link-local and cloud metadata hosts are always refused.'
    default: 'false'
  comment:
    description: 'Post/update a PR comment (true/false).'
    default: 'true'
outputs:
  max-mismatch:
    description: 'Highest mismatch percentage across frames.'
    value: ${{ steps.run.outputs.max-mismatch }}
  report-dir:
    description: 'Directory with index.html, results.json, summary.md and images.'
    value: ${{ steps.run.outputs.report-dir }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install framedrift
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npm ci --omit=dev --no-audit --no-fund
    - name: Compare preview with Figma
      id: run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/action.js"
      env:
        INPUT_FIGMA_TOKEN: ${{ inputs.figma-token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PREVIEW_URL: ${{ inputs.preview-url }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_FIGMA_FILES: ${{ inputs.figma-files }}
        INPUT_LICENSE_KEY: ${{ inputs.license-key }}
        INPUT_VERCEL_BYPASS_SECRET: ${{ inputs.vercel-bypass-secret }}
        INPUT_PREVIEW_HOSTS: ${{ inputs.preview-hosts }}
        INPUT_VERCEL_PROJECT: ${{ inputs.vercel-project }}
        INPUT_VERCEL_TEAM: ${{ inputs.vercel-team }}
        INPUT_ALLOW_LOOPBACK_PREVIEW: ${{ inputs.allow-loopback-preview }}
    - name: Upload report
      id: upload
      if: always() && steps.run.outputs.report-dir != '' && steps.run.outputs.skipped != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: framedrift-report-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.run.outputs.report-dir }}
        retention-days: 14
    - name: Comment on PR
      if: always() && inputs.comment == 'true' && steps.run.outputs.pr-number != '' && steps.run.outputs.skipped != 'true'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/action-comment.js"
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        FRAMEDRIFT_REPORT_DIR: ${{ steps.run.outputs.report-dir }}
        FRAMEDRIFT_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
    - name: Gate
      if: steps.run.outputs.skipped != 'true'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/action-gate.js"
      env:
        FRAMEDRIFT_GATE: ${{ steps.run.outputs.gate }}

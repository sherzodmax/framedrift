# Copy to .github/workflows/framedrift.yml in your app's repo.
# Runs after Vercel finishes a preview deployment for a PR (needs the Vercel GitHub integration).
name: framedrift
on: deployment_status

permissions:
  contents: read
  pull-requests: write   # to post/update the report comment
  deployments: read

# A new push supersedes the previous check for the same commit/environment.
concurrency:
  group: framedrift-${{ github.event.deployment.environment }}-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  design-drift:
    # Only successful preview deployments (skip Production).
    if: github.event.deployment_status.state == 'success' && !contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}   # read .framedrift.json from the deployed commit
      - uses: OWNER/framedrift@v0
        with:
          figma-token: ${{ secrets.FIGMA_TOKEN }}
          # Figma files this repo may render (keys from the file URLs). Frames linking other files are rejected.
          figma-files: 'YOUR_FILE_KEY'
          # Only if Vercel Deployment Protection is on:
          vercel-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Optional, framedrift Pro (unlimited frames, can fail the check):
          license-key: ${{ secrets.FRAMEDRIFT_LICENSE_KEY }}
          fail-on: '2'
